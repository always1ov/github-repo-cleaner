<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仓库与软件包管理台</title>
<style>
:root{
  --paper:#EDEFF2; --card:#FFFFFF; --ink:#18222E; --muted:#65748A;
  --line:#D4DAE3; --line-soft:#E6EAF0;
  --mark:#A3231C; --pick:#1F4E79; --pick-soft:rgba(31,78,121,.07);
  --ok:#2E6B4F; --warn:#8A6212; --radius:4px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 108px}
a{color:var(--ink)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

header{background:var(--card);border-bottom:1px solid var(--line)}
.hero{padding:34px 20px 30px;max-width:1180px;margin:0 auto}
.hero h1{margin:0 0 6px;font-size:30px;font-weight:650;letter-spacing:-.02em}
.hero p{margin:0 0 22px;color:var(--muted);max-width:62ch}
.connect{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.connect input{flex:1 1 380px;min-width:240px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#FBFCFD;font-family:var(--mono);font-size:13px;color:var(--ink)}
.btn{padding:10px 16px;border:1px solid var(--ink);border-radius:var(--radius);background:var(--ink);color:#fff;font-weight:550}
.btn:hover{background:#0F1822}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:#F2F4F7}
.btn.danger{background:var(--mark);border-color:var(--mark)}
.btn.danger:hover{background:#8B1C16}
.btn.sm{padding:6px 11px;font-size:13px;font-weight:500}
.hint{color:var(--muted);font-size:13px;margin-top:14px;max-width:80ch}
.hint code{font-family:var(--mono);background:#EFF1F5;padding:1px 5px;border-radius:3px;font-size:12px}
.err{color:var(--mark);margin-top:12px;font-size:13px}

.bar{display:none;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;max-width:1180px;margin:0 auto}
.bar.on{display:flex}
.who{display:flex;align-items:center;gap:9px;font-weight:550}
.who img{width:26px;height:26px;border-radius:50%;display:block}
.meta{color:var(--muted);font-size:13px}
.spacer{flex:1}
.tabs{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tabs button{padding:6px 13px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:#fff}

.tools{display:none;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tools.on{display:block}
.tools-in{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 20px;max-width:1180px;margin:0 auto}
.tools input[type=search],.tools select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#FBFCFD;color:var(--ink);font-size:13px}
.tools input[type=search]{flex:1 1 220px;min-width:160px}
.sep{width:1px;height:22px;background:var(--line-soft)}
.count{color:var(--muted);font-size:13px;white-space:nowrap}

main{max-width:1180px;margin:0 auto;padding:16px 20px}
.notice{color:var(--muted);font-size:13px;margin:0 0 12px}
.notice.warn{color:var(--warn)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
thead th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:#F7F8FA;white-space:nowrap}
thead th.s{cursor:pointer;user-select:none}
thead th.s:hover{color:var(--ink)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F8F9FB}
tbody tr.sel{background:var(--pick-soft)}
tbody tr.sel:hover{background:rgba(31,78,121,.11)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--pick)}
tbody tr.gone{opacity:.4}
tbody tr.gone .nm{text-decoration:line-through}
td.c{width:34px;text-align:center}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--pick);cursor:pointer;margin:0}
input[type=checkbox]:disabled{cursor:not-allowed;opacity:.4}
.nm{font-family:var(--mono);font-size:13px;font-weight:500;word-break:break-all}
.nm .ow{color:var(--muted);font-weight:400}
.desc{color:var(--muted);font-size:12px;margin-top:2px;max-width:56ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:#37455A}
.date{font-family:var(--mono);font-size:12.5px;color:#37455A;white-space:nowrap}
.tag{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:3px;font-size:11px;color:var(--muted);margin-right:4px;white-space:nowrap;background:#FAFBFC}
.tag.priv{border-color:#C9D2DE;color:#41506A}
.tag.arc{border-color:#E0D2AE;color:var(--warn);background:#FCF9F0}
.tag.keep{border-color:#BFD8CB;color:var(--ok);background:#F4FAF7}
.st{font-size:12px;white-space:nowrap}
.st.run{color:var(--warn)}
.st.ok{color:var(--ok)}
.st.err{color:var(--mark)}

.action{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;transform:translateY(100%);transition:transform .18s ease;z-index:40}
.action.on{transform:translateY(0)}
.action-in{max-width:1180px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.action strong{font-size:16px;display:block}
.action .sub{color:#A9B6C8;font-size:13px}
.action .btn.ghost{color:#fff;border-color:#3D4B5D}
.action .btn.ghost:hover{background:#26313F}
.acts{display:none;gap:10px;flex-wrap:wrap}
.acts.on{display:flex}

.mask{position:fixed;inset:0;background:rgba(20,28,38,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:6px;width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(16,24,34,.3)}
.modal h2{margin:0;padding:18px 22px 10px;font-size:19px;font-weight:650}
.modal .body{padding:0 22px;overflow:auto;flex:1}
.modal .body p{margin:6px 0 0;color:var(--muted)}
.modal .foot{padding:16px 22px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.list{margin:10px 0 4px;border:1px solid var(--line);border-radius:var(--radius);max-height:220px;overflow:auto}
.list div{padding:6px 10px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.list div:last-child{border-bottom:0}
.list .flag{font-family:var(--sans);font-size:11px;color:var(--mark)}
.field{margin:14px 0 2px}
.field label{display:block;font-size:13px;font-weight:550;margin-bottom:6px}
.field input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);font-family:var(--mono);font-size:13px}
.field input[type=number]{width:120px}
.ta{width:100%;height:240px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);font-family:var(--mono);font-size:12.5px;line-height:1.55;resize:vertical;color:var(--ink);background:#FBFCFD}
.tag.block{border-color:#E0BDBB;color:var(--mark);background:#FCF4F3}
.confirm-in{padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);font-family:var(--mono);width:170px;font-size:13px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:14px 0 4px;font-size:13.5px;color:#2A3646}
.log{font-family:var(--mono);font-size:12.5px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.log div{padding:2px 0}
.log .ok{color:var(--ok)}
.log .no{color:var(--mark)}
.prog{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin:14px 0 8px}
.prog i{display:block;height:100%;background:var(--pick);width:0;transition:width .2s}
.prog.red i{background:var(--mark)}
@media (max-width:760px){
  .hide-s{display:none}
  .hero h1{font-size:24px}
  main{padding:12px}
  .action-in{padding:11px 12px;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hero" id="hero">
    <h1>仓库与软件包管理台</h1>
    <p>粘贴一个 GitHub 令牌，列出你名下的仓库和 Packages。勾选后批量转移到组织、切换公开私有、清理镜像旧版本，或者一次删干净。每个动作执行前都会逐条列出来给你确认。</p>
    <div class="connect">
      <input id="token" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off" spellcheck="false">
      <button class="btn" id="go">读取</button>
    </div>
    <div class="err" id="err" hidden></div>
    <div class="hint">
      建议用经典令牌，勾选 <code>repo</code>、<code>delete_repo</code>、<code>read:org</code>、<code>read:packages</code>、<code>delete:packages</code>。
      Packages 接口目前只认经典令牌，细粒度令牌能管仓库但读不到软件包。令牌只留在这个页面的内存里，不写入任何存储，刷新即消失。
    </div>
  </div>
  <div class="bar" id="bar">
    <span class="who"><img id="avatar" alt=""><span id="login"></span></span>
    <span class="tabs">
      <button id="tabR" class="on">仓库</button>
      <button id="tabP">软件包</button>
    </span>
    <span class="meta" id="stat"></span>
    <span class="spacer"></span>
    <button class="btn ghost sm" id="scan">检测封禁仓库</button>
    <button class="btn ghost sm" id="refresh">重新读取</button>
    <button class="btn ghost sm" id="logout">退出</button>
  </div>
</header>

<div class="tools" id="tools">
  <div class="tools-in">
    <input type="search" id="q" placeholder="搜索名称  ( / )">
    <select id="fOwner"><option value="all">全部账号</option></select>
    <select id="fVis"></select>
    <select id="fKind"></select>
    <span class="sep"></span>
    <button class="btn ghost sm" id="selAll">选中当前列表</button>
    <button class="btn ghost sm" id="selNone">清空勾选</button>
    <span class="count" id="count"></span>
  </div>
</div>

<main>
  <p class="notice" id="notice" hidden></p>
  <div id="table"></div>
</main>

<div class="action" id="action">
  <div class="action-in">
    <div>
      <strong id="aCount">已选 0 个</strong>
      <span class="sub" id="aSize"></span>
    </div>
    <span class="spacer"></span>
    <button class="btn ghost sm" id="aClear">取消</button>
    <span class="acts on" id="actsR">
      <button class="btn ghost sm" id="ticket">生成删除工单</button>
      <button class="btn ghost sm" data-task="transfer">转移到组织</button>
      <button class="btn ghost sm" data-task="private">设为私有</button>
      <button class="btn ghost sm" data-task="public">设为公开</button>
      <button class="btn danger sm" data-task="delete">删除</button>
    </span>
    <span class="acts" id="actsP">
      <button class="btn ghost sm" data-task="prune">清理旧版本</button>
      <button class="btn danger sm" data-task="pkgDelete">删除软件包</button>
    </span>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h2 id="mTitle"></h2>
    <div class="body" id="mBody"></div>
    <div class="foot" id="mFoot"></div>
  </div>
</div>

<script>
const API = 'https://api.github.com';
const PKG_TYPES = ['container', 'npm', 'maven', 'rubygems', 'nuget', 'docker'];
const S = {
  token:'', user:null, view:'repos',
  repos:[], pkgs:[], orgs:[], pkgLoaded:false, pkgWarn:'',
  sel:new Set(), status:new Map(), gone:new Set(), blocked:new Map(), failed:new Map(), notice:'', scanning:false,
  sort:{repos:{key:'pushed_at',dir:-1}, packages:{key:'updated_at',dir:-1}},
  last:null, rate:'', scopes:null, tokenKind:'classic', busy:false
};
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- API ---------- */
async function gh(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      Authorization: 'Bearer ' + S.token,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.body ? {'Content-Type':'application/json'} : {}),
      ...(opts.headers || {})
    }
  });
  const rem = res.headers.get('x-ratelimit-remaining');
  if (rem !== null) S.rate = rem;
  const sc = res.headers.get('x-oauth-scopes');
  if (sc !== null) S.scopes = sc;
  const acc = res.headers.get('x-accepted-oauth-scopes');
  const perm = res.headers.get('x-accepted-github-permissions');
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    let msg = (data && data.message) || ('HTTP ' + res.status);
    if (data && data.errors && data.errors.length && data.errors[0].message) msg = data.errors[0].message;
    const e = new Error(msg); e.status = res.status; e.data = data;
    e.accepted = acc || ''; e.perms = perm || '';
    throw e;
  }
  return data;
}
async function ghAll(path) {
  const out = [];
  for (let page = 1; page <= 20; page++) {
    const sep = path.includes('?') ? '&' : '?';
    const batch = await gh(`${path}${sep}per_page=100&page=${page}`);
    if (!Array.isArray(batch)) break;
    out.push(...batch);
    if (batch.length < 100) break;
  }
  return out;
}

async function loadRepos() {
  S.user = await gh('/user');
  S.repos = await ghAll('/user/repos?affiliation=owner,organization_member&sort=pushed');
  S.blocked.clear(); S.failed.clear(); S.notice = '';
  try { S.orgs = (await ghAll('/user/orgs')).map(o => o.login); } catch (e) { S.orgs = []; }
}

async function loadPkgs() {
  const found = [];
  const scopes = [{ label: null }, ...S.orgs.map(o => ({ label: o }))];
  let denied = 0, tried = 0;
  for (const sc of scopes) {
    for (const t of PKG_TYPES) {
      tried++;
      const base = sc.label ? `/orgs/${sc.label}/packages` : '/user/packages';
      try {
        found.push(...await ghAll(`${base}?package_type=${t}`));
      } catch (e) {
        if (e.status === 401 || e.status === 403) denied++;
      }
      await sleep(60);
    }
  }
  S.pkgs = found;
  S.pkgLoaded = true;
  S.pkgWarn = denied === tried ? '读不到软件包：令牌缺少 read:packages 权限，或者用的是细粒度令牌（Packages 接口只支持经典令牌）。' : '';
}

/* ---------- 工具 ---------- */
function fmtSize(kb) {
  if (!kb) return '0';
  if (kb < 1024) return kb + ' KB';
  return (kb / 1024).toFixed(kb < 10240 ? 1 : 0) + ' MB';
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const days = Math.floor((Date.now() - d) / 86400000);
  let rel;
  if (days < 1) rel = '今天';
  else if (days < 30) rel = days + ' 天前';
  else if (days < 365) rel = Math.floor(days / 30) + ' 个月前';
  else rel = Math.floor(days / 365) + ' 年前';
  return `${d.toISOString().slice(0, 10)}  ${rel}`;
}
const isAdmin = r => !!(r.permissions && r.permissions.admin);
const alive = k => !S.gone.has(k);
const actionable = r => isAdmin(r) && alive(r.full_name);
const pkgKey = p => `${p.package_type}:${p.owner.login}/${p.name}`;
const pkgBase = p => (p.owner.login === S.user.login ? '/user' : `/orgs/${p.owner.login}`) +
  `/packages/${p.package_type}/${encodeURIComponent(p.name)}`;
const isRepos = () => S.view === 'repos';

/* ---------- 筛选 ---------- */
function filtered() {
  const q = $('#q').value.trim().toLowerCase();
  const ow = $('#fOwner').value, vis = $('#fVis').value, kind = $('#fKind').value;
  const st = S.sort[S.view], dir = st.dir, k = st.key;
  let list;
  if (isRepos()) {
    list = S.repos.filter(r => {
      if (q && !(r.full_name.toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q))) return false;
      if (ow !== 'all' && r.owner.login !== ow) return false;
      if (vis === 'public' && r.private) return false;
      if (vis === 'private' && !r.private) return false;
      if (kind === 'source' && (r.fork || r.archived)) return false;
      if (kind === 'fork' && !r.fork) return false;
      if (kind === 'archived' && !r.archived) return false;
      if (kind === 'empty' && r.size > 0) return false;
      if (kind === 'nostar' && r.stargazers_count > 0) return false;
      if (kind === 'blocked' && !S.blocked.has(r.full_name) && !S.failed.has(r.full_name)) return false;
      return true;
    });
    list.sort((a, b) => {
      if (k === 'full_name') return a.full_name.localeCompare(b.full_name) * dir;
      if (k === 'language') return String(a.language || '').localeCompare(String(b.language || '')) * dir;
      let x = a[k], y = b[k];
      if (k === 'pushed_at') { x = new Date(x || 0); y = new Date(y || 0); }
      return (x > y ? 1 : x < y ? -1 : 0) * dir;
    });
  } else {
    list = S.pkgs.filter(p => {
      if (q && !p.name.toLowerCase().includes(q)) return false;
      if (ow !== 'all' && p.owner.login !== ow) return false;
      if (vis !== 'all' && p.visibility !== vis) return false;
      if (kind !== 'all' && p.package_type !== kind) return false;
      return true;
    });
    list.sort((a, b) => {
      if (k === 'name') return a.name.localeCompare(b.name) * dir;
      if (k === 'package_type') return a.package_type.localeCompare(b.package_type) * dir;
      let x = a[k], y = b[k];
      if (k === 'updated_at') { x = new Date(x || 0); y = new Date(y || 0); }
      return (x > y ? 1 : x < y ? -1 : 0) * dir;
    });
  }
  return list;
}

/* ---------- 渲染 ---------- */
function render() {
  const list = filtered();
  const st = S.sort[S.view];
  const th = (key, label, cls = '') =>
    `<th class="s ${cls}" data-k="${key}">${label}${st.key === key ? (st.dir === 1 ? ' ↑' : ' ↓') : ''}</th>`;
  const total = isRepos() ? S.repos.length : S.pkgs.length;

  const nText = isRepos() ? S.notice : S.pkgWarn;
  $('#notice').hidden = !nText;
  $('#notice').className = 'notice' + (isRepos() && !S.blocked.size ? '' : ' warn');
  $('#notice').textContent = nText;
  $('#scan').style.display = isRepos() ? '' : 'none';
  $('#ticket').style.display = isRepos() ? '' : 'none';

  if (!total) {
    $('#table').innerHTML = `<div class="empty">${isRepos() ? '这个账号下还没有仓库。' : (S.pkgLoaded ? '没有找到软件包。' : '正在读取软件包…')}</div>`;
  } else if (!list.length) {
    $('#table').innerHTML = '<div class="empty">没有符合筛选条件的项目，换个条件试试。</div>';
  } else if (isRepos()) {
    const rows = list.map((r, i) => {
      const tags = [
        r.private ? '<span class="tag priv">私有</span>' : '<span class="tag">公开</span>',
        r.fork ? '<span class="tag">fork</span>' : '',
        r.archived ? '<span class="tag arc">已归档</span>' : '',
        r.stargazers_count > 0 ? `<span class="tag keep">★ ${r.stargazers_count}</span>` : '',
        isAdmin(r) ? '' : '<span class="tag">非管理员</span>',
        S.blocked.has(r.full_name) ? `<span class="tag block">已被封禁 · ${esc(S.blocked.get(r.full_name).reason)}</span>` : '',
        S.failed.has(r.full_name) ? `<span class="tag block">删除失败 · ${S.failed.get(r.full_name).status}</span>` : ''
      ].join('');
      return row({
        i, key: r.full_name, can: actionable(r), disTip: isAdmin(r) ? '' : '你在这个仓库不是管理员',
        name: `<span class="ow">${esc(r.owner.login)}/</span><a href="${esc(r.html_url)}" target="_blank" rel="noopener">${esc(r.name)}</a>`,
        desc: r.description, tags,
        cells: `<td class="date hide-s">${esc(r.language || '—')}</td>
                <td class="num">${fmtSize(r.size)}</td>
                <td class="num hide-s">${r.stargazers_count}</td>
                <td class="date hide-s">${fmtDate(r.pushed_at)}</td>`
      });
    }).join('');
    $('#table').innerHTML = table(`${th('full_name','仓库')}${th('language','语言','hide-s')}${th('size','体积')}${th('stargazers_count','Star','hide-s')}${th('pushed_at','最后提交','hide-s')}`, rows);
  } else {
    const rows = list.map((p, i) => {
      const repo = p.repository ? p.repository.full_name : '';
      const tags = [
        `<span class="tag">${esc(p.package_type)}</span>`,
        p.visibility === 'public' ? '<span class="tag">公开</span>' : `<span class="tag priv">${esc(p.visibility === 'internal' ? '内部' : '私有')}</span>`,
        repo ? `<span class="tag">来自 ${esc(repo)}</span>` : ''
      ].join('');
      return row({
        i, key: pkgKey(p), can: alive(pkgKey(p)), disTip: '',
        name: `<span class="ow">${esc(p.owner.login)}/</span><a href="${esc(p.html_url)}" target="_blank" rel="noopener">${esc(p.name)}</a>`,
        desc: '', tags,
        cells: `<td class="date hide-s">${esc(p.package_type)}</td>
                <td class="num">${p.version_count ?? '—'}</td>
                <td class="date hide-s">${fmtDate(p.updated_at)}</td>`
      });
    }).join('');
    $('#table').innerHTML = table(`${th('name','软件包')}${th('package_type','类型','hide-s')}${th('version_count','版本数')}${th('updated_at','更新时间','hide-s')}`, rows);
  }
  bindTable(list);
  updateBars(list);
}

function table(heads, rows) {
  return `<table><thead><tr>
    <th class="c"><input type="checkbox" id="hAll" title="选中当前列表"></th>
    ${heads}<th>状态</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function row(o) {
  const sel = S.sel.has(o.key), stt = S.status.get(o.key);
  return `<tr class="${sel ? 'sel' : ''} ${S.gone.has(o.key) ? 'gone' : ''}" data-i="${o.i}" data-n="${esc(o.key)}">
    <td class="c"><input type="checkbox" ${sel ? 'checked' : ''} ${o.can ? '' : 'disabled'} title="${esc(o.disTip)}"></td>
    <td><div class="nm">${o.name}</div>${o.desc ? `<div class="desc">${esc(o.desc)}</div>` : ''}<div>${o.tags}</div></td>
    ${o.cells}
    <td>${stt ? `<span class="st ${stt.state}">${esc(stt.text)}</span>` : ''}</td></tr>`;
}
function keyOf(x) { return isRepos() ? x.full_name : pkgKey(x); }
function usableOf(x) { return isRepos() ? actionable(x) : alive(pkgKey(x)); }

function bindTable(list) {
  const tbl = $('#table').querySelector('table');
  if (!tbl) return;
  const usable = list.filter(usableOf);
  const hAll = $('#hAll');
  hAll.checked = usable.length > 0 && usable.every(x => S.sel.has(keyOf(x)));
  hAll.onchange = () => { usable.forEach(x => hAll.checked ? S.sel.add(keyOf(x)) : S.sel.delete(keyOf(x))); render(); };

  tbl.querySelectorAll('thead th.s').forEach(el => el.onclick = () => {
    const k = el.dataset.k, cur = S.sort[S.view];
    const asc = ['full_name', 'language', 'name', 'package_type'].includes(k);
    S.sort[S.view] = { key: k, dir: cur.key === k ? -cur.dir : (asc ? 1 : -1) };
    render();
  });
  tbl.querySelectorAll('tbody tr').forEach(tr => {
    const box = tr.querySelector('input');
    tr.onclick = e => {
      if (e.target.tagName === 'A' || box.disabled) return;
      const i = +tr.dataset.i, key = tr.dataset.n;
      const on = e.target === box ? box.checked : !S.sel.has(key);
      if (e.shiftKey && S.last !== null) {
        const [a, b] = [Math.min(S.last, i), Math.max(S.last, i)];
        list.slice(a, b + 1).forEach(x => { if (usableOf(x)) on ? S.sel.add(keyOf(x)) : S.sel.delete(keyOf(x)); });
      } else {
        on ? S.sel.add(key) : S.sel.delete(key);
      }
      S.last = i;
      render();
    };
  });
}

function updateBars(list) {
  const total = isRepos() ? S.repos.length : S.pkgs.length;
  const picked = (isRepos() ? S.repos : S.pkgs).filter(x => S.sel.has(keyOf(x)));
  $('#count').textContent = `显示 ${list.length} / 共 ${total} 个 · 已选 ${picked.length}`;
  $('#aCount').textContent = `已选 ${picked.length} 个${isRepos() ? '仓库' : '软件包'}`;
  $('#aSize').textContent = isRepos()
    ? `合计 ${fmtSize(picked.reduce((a, r) => a + r.size, 0))} · 公开 ${picked.filter(r => !r.private).length} 个，私有 ${picked.filter(r => r.private).length} 个`
    : `合计 ${picked.reduce((a, p) => a + (p.version_count || 0), 0)} 个版本`;
  $('#action').classList.toggle('on', picked.length > 0 && !S.busy);
  $('#actsR').classList.toggle('on', isRepos());
  $('#actsP').classList.toggle('on', !isRepos());
  $('#stat').textContent = `${S.repos.length} 个仓库` + (S.pkgLoaded ? ` · ${S.pkgs.length} 个软件包` : '') +
    (S.orgs.length ? ` · ${S.orgs.length} 个组织` : '') + (S.rate ? ` · 剩余请求 ${S.rate}` : '') +
    (missingDelete() ? ' · 令牌缺少 delete_repo，删除会全部失败' : '');
}

/* ---------- 任务 ---------- */
const TASKS = {
  delete: {
    title: n => `删除 ${n} 个仓库`, verb: '删除', danger: true,
    note: '这些仓库连同它们的 issue、release、wiki 和访问设置会被永久删除，GitHub 不提供撤销。',
    pick: () => true,
    run: r => gh(`/repos/${r.owner.login}/${r.name}`, { method: 'DELETE' }),
    after: r => { S.gone.add(r.full_name); S.sel.delete(r.full_name); },
    okText: () => '已删除'
  },
  transfer: {
    title: n => `转移 ${n} 个仓库`, verb: '开始转移',
    note: '转移后仓库归目标组织所有，原地址会自动跳转。你在目标组织需要有创建仓库的权限；同名仓库会转移失败。',
    pick: () => true, field: { id: 'cTarget', label: '目标组织或账号', kind: 'org' },
    run: (r, o) => gh(`/repos/${r.owner.login}/${r.name}/transfer`, { method: 'POST', body: JSON.stringify({ new_owner: o.target }) }),
    after: r => { S.gone.add(r.full_name); S.sel.delete(r.full_name); },
    okText: (r, res, o) => '已提交转移 → ' + o.target
  },
  private: {
    title: n => `把 ${n} 个仓库设为私有`, verb: '设为私有',
    note: '设为私有后，仓库的 fork、GitHub Pages 站点和匿名访问会一并失效，star 数保留。',
    pick: r => !r.private, skipText: '已经是私有',
    run: r => gh(`/repos/${r.owner.login}/${r.name}`, { method: 'PATCH', body: JSON.stringify({ visibility: 'private' }) }),
    after: r => { r.private = true; r.visibility = 'private'; },
    okText: () => '已设为私有'
  },
  public: {
    title: n => `把 ${n} 个仓库设为公开`, verb: '设为公开',
    ack: '我确认这些仓库里没有密钥、令牌或其他不能公开的内容——公开后全部提交历史都能被任何人和爬虫读取。',
    note: '公开会暴露完整的提交历史，包括曾经删掉但仍在历史里的文件。',
    pick: r => r.private, skipText: '已经是公开',
    run: r => gh(`/repos/${r.owner.login}/${r.name}`, { method: 'PATCH', body: JSON.stringify({ visibility: 'public' }) }),
    after: r => { r.private = false; r.visibility = 'public'; },
    okText: () => '已设为公开'
  },
  pkgDelete: {
    title: n => `删除 ${n} 个软件包`, verb: '删除', danger: true, pkg: true,
    note: '整个软件包连同它的所有版本会被删除。公开且下载量超过 5000 次的包 GitHub 不允许通过接口删除。',
    pick: () => true,
    run: p => gh(pkgBase(p), { method: 'DELETE' }),
    after: p => { S.gone.add(pkgKey(p)); S.sel.delete(pkgKey(p)); },
    okText: () => '已删除'
  },
  prune: {
    title: n => `清理 ${n} 个软件包的旧版本`, verb: '开始清理', pkg: true,
    ack: '我知道被删除的版本无法恢复，正在被部署引用的镜像标签可能会失效。',
    note: '按创建时间保留最新的若干个版本，其余全部删除。如果一个包的版本被全部删掉，这个包本身也会消失。',
    pick: p => (p.version_count || 0) > 1, skipText: '版本数不足，无需清理',
    field: { id: 'cKeep', label: '保留最新几个版本', kind: 'number', value: 5 },
    run: async (p, o) => {
      const keep = Math.max(1, parseInt(o.keep, 10) || 1);
      let versions = await ghAll(`${pkgBase(p)}/versions?state=active`);
      versions.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      const doomed = versions.slice(keep);
      for (const v of doomed) {
        await gh(`${pkgBase(p)}/versions/${v.id}`, { method: 'DELETE' });
        await sleep(150);
      }
      return doomed.length;
    },
    after: (p, o, n) => { p.version_count = Math.max(0, (p.version_count || 0) - n); },
    okText: (p, n) => n ? `已清理 ${n} 个版本` : '没有可清理的版本'
  }
};

function openTask(kind) {
  const T = TASKS[kind];
  const pool = T.pkg ? S.pkgs : S.repos;
  const chosen = pool.filter(x => S.sel.has(keyOf(x)) && usableOf(x));
  const items = chosen.filter(T.pick);
  const skipped = chosen.length - items.length;
  if (!items.length) {
    show('没有可执行的项目', `<p>所选项目${T.skipText ? '都' + T.skipText : '不适用这个操作'}。</p>`,
      `<span class="spacer"></span><button class="btn ghost sm" id="cCancel">知道了</button>`);
    $('#cCancel').onclick = closeModal;
    return;
  }
  const rows = items.map(x => {
    const flags = [];
    if (!T.pkg) {
      if (kind === 'delete' || kind === 'transfer') {
        if (x.stargazers_count) flags.push(`★ ${x.stargazers_count}`);
        if (x.forks_count) flags.push(`${x.forks_count} 个 fork`);
      }
      if (x.archived) flags.push('已归档');
    } else {
      flags.push(`${x.version_count || 0} 个版本`);
      if (x.visibility === 'public') flags.push('公开');
    }
    return `<div><span>${esc(T.pkg ? `${x.owner.login}/${x.name}` : x.full_name)}</span><span class="flag">${flags.join(' · ')}</span></div>`;
  }).join('');

  const f = T.field;
  const fieldHtml = !f ? '' : f.kind === 'number'
    ? `<div class="field"><label for="${f.id}">${esc(f.label)}</label><input id="${f.id}" type="number" min="0" step="1" value="${f.value}"></div>`
    : `<div class="field"><label for="${f.id}">${esc(f.label)}</label>
        <input id="${f.id}" list="orgList" placeholder="${S.orgs.length ? esc(S.orgs[0]) : 'my-org'}" autocomplete="off" spellcheck="false">
        <datalist id="orgList">${S.orgs.map(o => `<option value="${esc(o)}">`).join('')}</datalist></div>`;
  const ackText = T.danger ? `我确认上面这些${T.pkg ? '软件包' : '仓库'}都可以删除，并且已备份需要保留的内容。` : T.ack;

  const preflight = (kind === 'delete' && missingDelete())
    ? `<p style="color:#A3231C">当前令牌没有 delete_repo 权限，这批删除会全部失败。先到 <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">令牌设置</a> 补上权限，再点顶部的重新读取。</p>` : '';
  show(T.title(items.length), `
    <p>${esc(T.note)}</p>
    ${preflight}
    ${skipped ? `<p style="color:#8A6212">另有 ${skipped} 个${T.skipText || '不适用'}，会跳过。</p>` : ''}
    <div class="list">${rows}</div>
    ${fieldHtml}
    ${ackText ? `<label class="chk"><input type="checkbox" id="cAck"><span>${esc(ackText)}</span></label>` : ''}`,
    `${T.danger ? `<input class="confirm-in" id="cWord" placeholder="输入 DELETE" autocomplete="off" spellcheck="false">
       <button class="btn ghost sm" id="cFill" title="填入 DELETE">填入</button>` : ''}
     <span class="spacer"></span>
     <button class="btn ghost sm" id="cCancel">返回</button>
     <button class="btn ${T.danger ? 'danger' : ''} sm" id="cRun">${T.verb}</button>`);

  const btn = $('#cRun');
  const check = () => {
    let ok = true;
    if (T.danger) ok = $('#cAck').checked && $('#cWord').value.trim().toUpperCase() === 'DELETE';
    else if (T.ack) ok = $('#cAck').checked;
    if (f && f.kind === 'org') ok = ok && $('#cTarget').value.trim().length > 0;
    if (f && f.kind === 'number') ok = ok && $('#cKeep').value !== '' && +$('#cKeep').value >= 0;
    btn.disabled = !ok;
  };
  ['#cAck', '#cWord', '#cTarget', '#cKeep'].forEach(s => { const el = $(s); if (el) { el.oninput = check; el.onchange = check; } });
  if ($('#cFill')) $('#cFill').onclick = () => { $('#cWord').value = 'DELETE'; check(); if (btn.disabled) $('#cAck').focus(); else btn.focus(); };
  check();
  $('#cCancel').onclick = closeModal;
  btn.onclick = () => runTask(items, kind, {
    target: f && f.kind === 'org' ? $('#cTarget').value.trim() : null,
    keep: f && f.kind === 'number' ? $('#cKeep').value : null
  });
  ($('#cTarget') || $('#cKeep') || $('#cWord') || btn).focus();
}

function show(title, body, foot) {
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = body;
  $('#mFoot').innerHTML = foot;
  $('#mask').classList.add('on');
}

async function runTask(items, kind, opts) {
  const T = TASKS[kind];
  S.busy = true;
  $('#action').classList.remove('on');
  show('正在执行：' + T.title(items.length),
    `<div class="prog ${T.danger ? 'red' : ''}"><i id="pBar"></i></div><div class="log" id="pLog"></div>`,
    `<span class="count" id="pTip">进行中，请勿关闭页面。</span><span class="spacer"></span><button class="btn ghost sm" id="pClose" disabled>完成</button>`);
  const log = $('#pLog');
  let done = 0, fail = 0;
  for (let i = 0; i < items.length; i++) {
    const x = items[i], key = T.pkg ? pkgKey(x) : x.full_name;
    const label = T.pkg ? `${x.owner.login}/${x.name}` : x.full_name;
    S.status.set(key, { state: 'run', text: '处理中…' }); render();
    try {
      const res = await T.run(x, opts);
      T.after(x, opts, res);
      const txt = T.okText(x, res, opts);
      S.status.set(key, { state: 'ok', text: txt });
      done++;
      log.insertAdjacentHTML('beforeend', `<div class="ok">${esc(txt)}  ${esc(label)}</div>`);
    } catch (e) {
      let msg = e.status === 404 ? '不存在或无权访问' : e.message;
      let extra = '';
      if (e.status === 403) {
        msg = '权限不足：' + e.message;
        const need = e.perms || e.accepted;
        extra = (need ? `<br>　接口需要：${esc(need)}；令牌持有：${esc(S.scopes || (S.tokenKind === 'fine' ? '细粒度令牌' : '未知'))}` : '') +
          `<br>　${esc(scopeAdvice())}`;
      }
      if (e.status === 451) {
        const b = (e.data && e.data.block) || {};
        msg = `已被 GitHub 封禁${b.reason ? '（' + b.reason + '）' : ''}，只能联系支持删除`;
        if (b.html_url) extra = ` <a href="${esc(b.html_url)}" target="_blank" rel="noopener">封禁公告</a>`;
      }
      S.status.set(key, { state: 'err', text: msg });
      if (kind === 'delete' && e.status !== 451) S.failed.set(x.full_name, { status: e.status, msg: e.message });
      fail++;
      log.insertAdjacentHTML('beforeend', `<div class="no">失败  ${esc(label)} — ${esc(msg)}${extra}</div>`);
    }
    log.scrollTop = log.scrollHeight;
    $('#pBar').style.width = ((i + 1) / items.length * 100) + '%';
    render();
    await sleep(250);
  }
  S.busy = false;
  $('#mTitle').textContent = fail ? '执行完成，有失败项' : '执行完成';
  $('#pTip').textContent = `成功 ${done} 个${fail ? `，失败 ${fail} 个` : ''}。` +
    (kind === 'transfer' ? ' 转移由 GitHub 异步处理，稍后重新读取即可确认。' : '');
  const btn = $('#pClose'); btn.disabled = false; btn.onclick = closeModal; btn.focus();
  render();
}
function closeModal() { if (!S.busy) $('#mask').classList.remove('on'); }

/* ---------- 权限诊断 ---------- */
function missingDelete() {
  return S.tokenKind === 'classic' && typeof S.scopes === 'string' && S.scopes !== '' && !S.scopes.includes('delete_repo');
}
function scopeAdvice() {
  return S.tokenKind === 'fine'
    ? '你用的是细粒度令牌：需要把 Repository permissions → Administration 设为 Read and write，并确认令牌的仓库访问范围覆盖了这个仓库；组织下的仓库还要组织管理员批准该令牌。'
    : `你用的是经典令牌，当前权限为 [${S.scopes || '未知'}]。删除仓库必须勾选 delete_repo，改完权限重新读取即可。`;
}

/* ---------- 封禁检测与工单 ---------- */
async function scanBlocked() {
  if (S.scanning || !S.repos.length) return;
  S.scanning = true; S.blocked.clear();
  $('#scan').disabled = true;
  const note = $('#notice'); note.hidden = false; note.className = 'notice';
  const list = S.repos.slice();
  let next = 0, done = 0;
  const worker = async () => {
    while (next < list.length) {
      const r = list[next++];
      try { await gh(`/repos/${r.owner.login}/${r.name}`); }
      catch (e) {
        if (e.status === 451) {
          const b = (e.data && e.data.block) || {};
          S.blocked.set(r.full_name, { reason: b.reason || 'unknown', url: b.html_url || '', at: b.created_at || '' });
        }
      }
      done++;
      note.textContent = `正在逐个检测…  ${done} / ${list.length}，已发现 ${S.blocked.size} 个被封禁`;
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  S.scanning = false;
  $('#scan').disabled = false;
  S.notice = S.blocked.size
    ? `发现 ${S.blocked.size} 个被 GitHub 封禁的仓库。接口和设置页都删不掉，用「生成删除工单」把它们提给支持团队。`
    : '没有被封禁的仓库。';
  render();
}

function ticketReason(r) {
  const b = S.blocked.get(r.full_name);
  if (b) return `disabled by GitHub, reason: ${b.reason}${b.url ? `, notice: ${b.url}` : ''}`;
  const f = S.failed.get(r.full_name);
  if (f) return `deletion returns HTTP ${f.status}: ${f.msg}`;
  if (!isAdmin(r)) return 'I have no admin rights on this repository';
  return 'I am unable to delete it from my account';
}
function ticketText(items) {
  const lines = items.map(r => `- ${r.full_name}  (${ticketReason(r)})`).join('\n');
  return `Hello,

I am the owner of the repositories listed below. I cannot remove them myself: they are either disabled by GitHub and return HTTP 451 "Repository access blocked", or my deletion requests are rejected, so the settings page and the API are both unavailable to me.

${lines}

Please permanently delete these repositories from my account. I am not disputing any takedown and I am not filing a counter notice - I only want them removed so they no longer appear under my account.

GitHub username: ${S.user.login}

Thank you.`;
}

async function copyText(t, btn) {
  try {
    await navigator.clipboard.writeText(t);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  if (btn) { const old = btn.textContent; btn.textContent = '已复制'; setTimeout(() => btn.textContent = old, 1600); }
}

function openTicket() {
  const stuck = r => S.blocked.has(r.full_name) || S.failed.has(r.full_name);
  const picked = S.repos.filter(r => S.sel.has(r.full_name));
  const items = picked.length ? picked : S.repos.filter(stuck);
  if (!items.length) {
    show('没有需要提交的仓库',
      '<p>还没有发现删不掉的仓库。点顶部的「检测封禁仓库」扫一遍，或者先试一次删除——失败的会自动记下来。也可以直接勾选想交给客服的仓库再来。</p>',
      '<span class="spacer"></span><button class="btn ghost sm" id="cCancel">知道了</button>');
    $('#cCancel').onclick = closeModal; return;
  }
  const nBlocked = items.filter(r => S.blocked.has(r.full_name)).length;
  const n403 = items.filter(r => { const f = S.failed.get(r.full_name); return f && f.status === 403; }).length;
  const txt = ticketText(items);
  const warn = (n403 && missingDelete())
    ? `<p style="color:#A3231C">这里面有 ${n403} 个是 403 失败的，而你的令牌本来就没有 delete_repo 权限——客服会让你自己补权限再删。建议先到 <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">令牌设置</a> 补上，重新读取后再删一次，剩下还失败的才值得提工单。</p>` : '';
  show(`删除工单 · ${items.length} 个仓库`, `
    <p>GitHub 不提供提交工单的接口，所以这里生成好正文：复制后打开支持页，Subject 填 Request to delete repositories I cannot remove, 正文粘贴即可。其中封禁 ${nBlocked} 个、删除失败 ${items.length - nBlocked} 个。${picked.length ? '（按你当前的勾选生成。）' : '（未勾选，用的是全部删不掉的仓库。）'}</p>
    ${warn}
    <textarea class="ta" id="tTxt" readonly>${esc(txt)}</textarea>`,
    `<button class="btn sm" id="tCopy">复制正文</button>
     <button class="btn ghost sm" id="tOpen">打开支持页</button>
     <span class="spacer"></span>
     <button class="btn ghost sm" id="cCancel">关闭</button>`);
  $('#tCopy').onclick = e => copyText(txt, e.target);
  $('#tOpen').onclick = async () => { await copyText(txt, $('#tCopy')); window.open('https://support.github.com/request', '_blank', 'noopener'); };
  $('#cCancel').onclick = closeModal;
  $('#tTxt').focus();
}

/* ---------- 视图 ---------- */
function fillFilters() {
  const owners = [...new Set((isRepos() ? S.repos : S.pkgs).map(x => x.owner.login))].sort();
  $('#fOwner').innerHTML = '<option value="all">全部账号</option>' + owners.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
  $('#fVis').innerHTML = isRepos()
    ? '<option value="all">公开与私有</option><option value="public">仅公开</option><option value="private">仅私有</option>'
    : '<option value="all">全部可见性</option><option value="public">仅公开</option><option value="private">仅私有</option><option value="internal">仅内部</option>';
  $('#fKind').innerHTML = isRepos()
    ? '<option value="all">全部类型</option><option value="source">仅原创</option><option value="fork">仅 fork</option><option value="archived">仅已归档</option><option value="empty">仅空仓库</option><option value="nostar">无人 star</option><option value="blocked">仅无法删除</option>'
    : '<option value="all">全部类型</option>' + [...new Set(S.pkgs.map(p => p.package_type))].sort().map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  $('#q').value = '';
}
async function switchView(v) {
  if (S.busy || S.view === v) return;
  S.view = v; S.sel.clear(); S.last = null;
  $('#tabR').classList.toggle('on', v === 'repos');
  $('#tabP').classList.toggle('on', v === 'packages');
  fillFilters(); render();
  if (v === 'packages' && !S.pkgLoaded) {
    $('#table').innerHTML = '<div class="empty">正在读取软件包…</div>';
    try { await loadPkgs(); } catch (e) { S.pkgWarn = '读取软件包失败：' + e.message; S.pkgLoaded = true; }
    fillFilters(); render();
  }
}

/* ---------- 连接 ---------- */
async function connect() {
  const t = $('#token').value.trim();
  if (!t) { showErr('先粘贴一个令牌。'); return; }
  S.token = t;
  S.tokenKind = t.startsWith('github_pat_') ? 'fine' : 'classic';
  $('#go').disabled = true; $('#go').textContent = '读取中…';
  $('#err').hidden = true;
  try {
    await loadRepos();
    $('#token').value = '';
    $('#hero').style.display = 'none';
    $('#bar').classList.add('on');
    $('#tools').classList.add('on');
    $('#avatar').src = S.user.avatar_url;
    $('#login').textContent = S.user.login;
    fillFilters(); render();
  } catch (e) {
    showErr(e.status === 401 ? '令牌无效或已过期，检查后重试。' : '读取失败：' + e.message);
  } finally {
    $('#go').disabled = false; $('#go').textContent = '读取';
  }
}
function showErr(m) { const el = $('#err'); el.textContent = m; el.hidden = false; }

/* ---------- 事件 ---------- */
$('#go').onclick = connect;
$('#token').onkeydown = e => { if (e.key === 'Enter') connect(); };
$('#tabR').onclick = () => switchView('repos');
$('#tabP').onclick = () => switchView('packages');
$('#refresh').onclick = async () => {
  try {
    S.sel.clear(); S.status.clear(); S.gone.clear(); S.failed.clear();
    await loadRepos();
    if (S.pkgLoaded) { S.pkgLoaded = false; await loadPkgs(); }
    fillFilters(); render();
  } catch (e) { alert('读取失败：' + e.message); }
};
$('#scan').onclick = scanBlocked;
$('#ticket').onclick = openTicket;
$('#logout').onclick = () => location.reload();
['#q', '#fOwner', '#fVis', '#fKind'].forEach(s => $(s).addEventListener('input', () => { S.last = null; render(); }));
$('#selAll').onclick = () => { filtered().forEach(x => { if (usableOf(x)) S.sel.add(keyOf(x)); }); render(); };
$('#selNone').onclick = () => { S.sel.clear(); render(); };
$('#aClear').onclick = () => { S.sel.clear(); render(); };
document.querySelectorAll('[data-task]').forEach(b => b.onclick = () => openTask(b.dataset.task));
$('#mask').onclick = e => { if (e.target === $('#mask')) closeModal(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && $('#tools').classList.contains('on')) { e.preventDefault(); $('#q').focus(); }
});
window.addEventListener('beforeunload', e => { if (S.busy) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
