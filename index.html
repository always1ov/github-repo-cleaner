<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://api.github.com; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Bulk-manage your GitHub repositories and packages from one page. Runs entirely in your browser; the only host it can reach is api.github.com.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2318222E'/%3E%3Cpath d='M9 12h14M9 17h14M9 22h8' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<title>GitHub Repo Cleaner</title>
<style>
:root{
  --paper:#EDEFF2; --card:#FFFFFF; --ink:#18222E; --muted:#65748A;
  --line:#D4DAE3; --line-soft:#E6EAF0; --soft:#F7F8FA; --field:#FBFCFD; --hover:#F8F9FB;
  --mark:#A3231C; --mark-bg:#FCF4F3; --mark-line:#E0BDBB; --danger:#A3231C;
  --pick:#1F4E79; --pick-soft:rgba(31,78,121,.07); --pick-soft2:rgba(31,78,121,.11);
  --ok:#2E6B4F; --ok-bg:#F4FAF7; --ok-line:#BFD8CB;
  --warn:#8A6212; --warn-bg:#FCF9F0; --warn-line:#E0D2AE;
  --btn-fg:#FFFFFF; --btn-hover:#0F1822;
  --bar-bg:#18222E; --bar-fg:#FFFFFF; --bar-sub:#A9B6C8; --bar-line:#3D4B5D; --bar-hover:#26313F;
  --num:#37455A; --shadow:0 20px 50px rgba(16,24,34,.3);
  --radius:4px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1218; --card:#161C24; --ink:#E4EAF1; --muted:#8B9AAE;
    --line:#2B3441; --line-soft:#232B36; --soft:#1B222C; --field:#12171E; --hover:#1B222C;
    --mark:#E8736B; --mark-bg:#2A1A19; --mark-line:#5A3230; --danger:#B4362D;
    --pick:#74A9DB; --pick-soft:rgba(116,169,219,.10); --pick-soft2:rgba(116,169,219,.16);
    --ok:#6DBF97; --ok-bg:#16241D; --ok-line:#2F4A3B;
    --warn:#D9AE5C; --warn-bg:#241F14; --warn-line:#4A3D24;
    --btn-fg:#0E1218; --btn-hover:#C9D4E0;
    --bar-bg:#242E3B; --bar-fg:#EDF1F6; --bar-sub:#9AA9BC; --bar-line:#3D4B5D; --bar-hover:#2F3B4B;
    --num:#A9B7C9; --shadow:0 20px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1218; --card:#161C24; --ink:#E4EAF1; --muted:#8B9AAE;
  --line:#2B3441; --line-soft:#232B36; --soft:#1B222C; --field:#12171E; --hover:#1B222C;
  --mark:#E8736B; --mark-bg:#2A1A19; --mark-line:#5A3230; --danger:#B4362D;
  --pick:#74A9DB; --pick-soft:rgba(116,169,219,.10); --pick-soft2:rgba(116,169,219,.16);
  --ok:#6DBF97; --ok-bg:#16241D; --ok-line:#2F4A3B;
  --warn:#D9AE5C; --warn-bg:#241F14; --warn-line:#4A3D24;
  --btn-fg:#0E1218; --btn-hover:#C9D4E0;
  --bar-bg:#242E3B; --bar-fg:#EDF1F6; --bar-sub:#9AA9BC; --bar-line:#3D4B5D; --bar-hover:#2F3B4B;
  --num:#A9B7C9; --shadow:0 20px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 108px;display:flex;flex-direction:column;min-height:100vh}
a{color:var(--ink)}
a:hover{color:var(--pick)}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.spacer{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header{background:var(--card);border-bottom:1px solid var(--line)}
.hero{padding:34px 20px 30px}
.hero-top{display:flex;align-items:flex-start;gap:12px}
.utils{display:flex;gap:6px;flex:0 0 auto}
.hero h1{margin:0 0 6px;font-size:30px;font-weight:650;letter-spacing:-.02em}
.hero .lede{margin:0 0 22px;color:var(--muted);max-width:64ch}
.connect{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.connect input{flex:1 1 380px;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--field);font-family:var(--mono);font-size:13px;color:var(--ink)}
.btn{padding:10px 16px;border:1px solid var(--ink);border-radius:var(--radius);background:var(--ink);color:var(--btn-fg);font-weight:550}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{filter:brightness(.9)}
.btn.sm{padding:6px 11px;font-size:13px;font-weight:500}
.btn.link{background:none;border:0;padding:0;text-decoration:underline;font-size:13px;color:var(--muted)}
.btn.link:hover{color:var(--ink);background:none}
.err{color:var(--mark);margin-top:12px;font-size:13px}

.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:24px}
.trust div{border:1px solid var(--line-soft);border-radius:var(--radius);padding:11px 13px;background:var(--soft)}
.trust b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.trust span{color:var(--muted);font-size:12.5px}
.hint{color:var(--muted);font-size:13px;margin-top:18px;max-width:84ch}
.hint code{font-family:var(--mono);background:var(--soft);border:1px solid var(--line-soft);padding:1px 5px;border-radius:3px;font-size:12px}
.hint a{color:var(--pick)}

.bar{display:none;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px}
.bar.on{display:flex}
.who{display:flex;align-items:center;gap:9px;font-weight:550}
.mono-badge{width:26px;height:26px;border-radius:50%;background:var(--pick);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:650}
.meta{color:var(--muted);font-size:13px}
.tabs{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tabs button{padding:6px 13px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--btn-fg)}
.demo-flag{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);border-radius:3px;padding:2px 8px;font-size:12px;font-weight:600}

.tools{display:none;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tools.on{display:block}
.tools-in{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 20px}
.tools input[type=search],.tools select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--field);color:var(--ink);font-size:13px}
.tools input[type=search]{flex:1 1 200px;min-width:150px}
.sep{width:1px;height:22px;background:var(--line-soft)}
.count{color:var(--muted);font-size:13px;white-space:nowrap}

main{max-width:1180px;width:100%;margin:0 auto;padding:16px 20px;flex:1 0 auto}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.stat{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:7px 12px;text-align:left;min-width:104px}
.stat:hover{border-color:var(--pick);background:var(--pick-soft)}
.stat.on{border-color:var(--pick);background:var(--pick-soft)}
.stat b{display:block;font-size:16px;font-weight:600;font-family:var(--mono);line-height:1.3}
.stat span{color:var(--muted);font-size:12px}
.notice{font-size:13px;margin:0 0 12px;padding:9px 12px;border-radius:var(--radius);border:1px solid var(--line-soft);background:var(--soft);color:var(--muted)}
.notice.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.notice.bad{border-color:var(--mark-line);background:var(--mark-bg);color:var(--mark)}
.notice a{color:inherit}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
thead th.s{cursor:pointer;user-select:none}
thead th.s:hover{color:var(--ink)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--pick-soft)}
tbody tr.sel:hover{background:var(--pick-soft2)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--pick)}
tbody tr.gone{opacity:.4}
tbody tr.gone .nm{text-decoration:line-through}
td.c{width:34px;text-align:center}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--pick);cursor:pointer;margin:0}
input[type=checkbox]:disabled{cursor:not-allowed;opacity:.4}
.nm{font-family:var(--mono);font-size:13px;font-weight:500;word-break:break-all}
.nm .ow{color:var(--muted);font-weight:400}
.desc{color:var(--muted);font-size:12px;margin-top:2px;max-width:56ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--num)}
.date{font-family:var(--mono);font-size:12.5px;color:var(--num);white-space:nowrap}
.tag{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:3px;font-size:11px;color:var(--muted);margin:2px 4px 0 0;white-space:nowrap;background:var(--soft)}
.tag.priv{border-color:var(--line);color:var(--ink)}
.tag.arc{border-color:var(--warn-line);color:var(--warn);background:var(--warn-bg)}
.tag.keep{border-color:var(--ok-line);color:var(--ok);background:var(--ok-bg)}
.tag.block{border-color:var(--mark-line);color:var(--mark);background:var(--mark-bg)}
.st{font-size:12px;white-space:nowrap}
.st.run{color:var(--warn)}
.st.ok{color:var(--ok)}
.st.err{color:var(--mark)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px 0 0;flex-wrap:wrap;color:var(--muted);font-size:13px}

.action{position:fixed;left:0;right:0;bottom:0;background:var(--bar-bg);color:var(--bar-fg);transform:translateY(100%);transition:transform .18s ease;z-index:40}
.action.on{transform:translateY(0)}
.action-in{max-width:1180px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.action strong{font-size:16px;display:block}
.action .sub{color:var(--bar-sub);font-size:13px}
.action .btn.ghost{color:var(--bar-fg);border-color:var(--bar-line);background:transparent}
.action .btn.ghost:hover{background:var(--bar-hover)}
.acts{display:none;gap:8px;flex-wrap:wrap}
.acts.on{display:flex}

.mask{position:fixed;inset:0;background:rgba(12,18,26,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:6px;width:100%;max-width:660px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal h2{margin:0;padding:18px 22px 10px;font-size:19px;font-weight:650}
.modal .body{padding:0 22px;overflow:auto;flex:1}
.modal .body p{margin:6px 0 0;color:var(--muted)}
.modal .body p.bad{color:var(--mark)}
.modal .body p.warn{color:var(--warn)}
.modal .foot{padding:16px 22px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.list{margin:10px 0 4px;border:1px solid var(--line);border-radius:var(--radius);max-height:220px;overflow:auto}
.list div{padding:6px 10px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.list div:last-child{border-bottom:0}
.list .flag{font-family:var(--sans);font-size:11px;color:var(--mark);margin-left:auto;text-align:right}
.field{margin:14px 0 2px}
.field label{display:block;font-size:13px;font-weight:550;margin-bottom:6px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);font-family:var(--mono);font-size:13px;background:var(--field);color:var(--ink)}
.field input[type=number]{width:130px}
.ta{width:100%;height:230px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);font-family:var(--mono);font-size:12.5px;line-height:1.55;resize:vertical;color:var(--ink);background:var(--field)}
.confirm-in{padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);font-family:var(--mono);width:170px;font-size:13px;background:var(--field);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:flex-start;margin:14px 0 4px;font-size:13.5px}
.log{font-family:var(--mono);font-size:12.5px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);padding:10px;background:var(--field)}
.log div{padding:2px 0;word-break:break-word}
.log .ok{color:var(--ok)}
.log .no{color:var(--mark)}
.log .sk{color:var(--muted)}
.prog{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin:14px 0 8px}
.prog i{display:block;height:100%;background:var(--pick);width:0;transition:width .2s}
.prog.red i{background:var(--mark)}
.perm{width:100%;border-collapse:collapse;margin-top:10px}
.perm td{padding:6px 8px;border-bottom:1px solid var(--line-soft);font-size:13px}
.perm td:first-child{font-weight:550;white-space:nowrap}
.perm td:last-child{text-align:right;white-space:nowrap;font-size:12.5px}
.perm .y{color:var(--ok)}
.perm .n{color:var(--mark)}
.keys{width:100%;border-collapse:collapse}
.keys td{padding:5px 8px;border-bottom:1px solid var(--line-soft);font-size:13px}
.keys kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:1px 6px;background:var(--soft)}

footer{max-width:1180px;width:100%;margin:0 auto;padding:26px 20px 10px;flex:0 0 auto;color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
footer a{color:var(--muted)}

@media (max-width:760px){
  .hide-s{display:none}
  .hero{padding:24px 16px 22px}
  .hero h1{font-size:23px}
  main{padding:12px 16px}
  .bar,.tools-in{padding:10px 16px}
  .action-in{padding:11px 16px;gap:8px}
  .modal h2{padding:15px 16px 8px}
  .modal .body{padding:0 16px}
  .modal .foot{padding:14px 16px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hero wrap" id="hero">
    <div class="hero-top">
      <div>
        <h1 data-i18n="app.title">GitHub Repo Cleaner</h1>
        <p class="lede" data-i18n="app.lede"></p>
      </div>
      <span class="spacer"></span>
      <span class="utils" id="utils">
        <button class="btn ghost sm" id="lang" title="Language / 语言">EN</button>
        <button class="btn ghost sm" id="theme" title="Theme">◐</button>
      </span>
    </div>
    <div class="connect">
      <input id="token" type="password" placeholder="ghp_… / github_pat_…" autocomplete="off" spellcheck="false" aria-label="GitHub token">
      <button class="btn" id="go" data-i18n="act.connect"></button>
      <button class="btn ghost" id="demo" data-i18n="act.demo"></button>
    </div>
    <div class="err" id="err" hidden role="alert"></div>
    <div class="trust" id="trust"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="bar wrap" id="bar">
    <span class="who"><span class="mono-badge" id="avatar" aria-hidden="true"></span><span id="login"></span></span>
    <span class="demo-flag" id="demoFlag" hidden data-i18n="demo.flag"></span>
    <span class="tabs" role="tablist">
      <button id="tabR" class="on" role="tab" aria-selected="true" data-i18n="tab.repos"></button>
      <button id="tabP" role="tab" aria-selected="false" data-i18n="tab.packages"></button>
    </span>
    <span class="meta" id="stat"></span>
    <span class="spacer"></span>
    <button class="btn ghost sm" id="perms" data-i18n="act.perms"></button>
    <button class="btn ghost sm" id="scan" data-i18n="act.scan"></button>
    <button class="btn ghost sm" id="refresh" data-i18n="act.refresh"></button>
    <button class="btn ghost sm" id="logout" data-i18n="act.logout"></button>
    <span id="utilsSlot"></span>
  </div>
</header>

<div class="tools" id="tools">
  <div class="tools-in wrap">
    <input type="search" id="q" placeholder="" aria-label="Search">
    <select id="fOwner" aria-label="Owner"></select>
    <select id="fVis" aria-label="Visibility"></select>
    <select id="fKind" aria-label="Kind"></select>
    <select id="fAge" aria-label="Age"></select>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn ghost sm" id="selAll" data-i18n="act.selAll"></button>
    <button class="btn ghost sm" id="selInv" data-i18n="act.selInv"></button>
    <button class="btn ghost sm" id="selNone" data-i18n="act.selNone"></button>
    <span class="count" id="count"></span>
  </div>
</div>

<main>
  <div class="stats" id="stats"></div>
  <p class="notice" id="notice" hidden aria-live="polite"></p>
  <div id="table"></div>
  <div class="pager" id="pager"></div>
</main>

<footer>
  <span id="footNote"></span>
  <span class="spacer"></span>
  <button class="btn link" id="keysBtn" data-i18n="act.keys"></button>
  <a href="https://github.com/always1ov/github-repo-cleaner" target="_blank" rel="noopener noreferrer">Source</a>
</footer>

<div class="action" id="action">
  <div class="action-in">
    <div>
      <strong id="aCount"></strong>
      <span class="sub" id="aSize"></span>
    </div>
    <span class="spacer"></span>
    <button class="btn ghost sm" id="aClear" data-i18n="act.cancel"></button>
    <span class="acts on" id="actsR">
      <button class="btn ghost sm" id="export" data-i18n="act.export"></button>
      <button class="btn ghost sm" id="backup" data-i18n="act.backup"></button>
      <button class="btn ghost sm" id="ticket" data-i18n="act.ticket"></button>
      <button class="btn ghost sm" data-task="archive" data-i18n="task.archive.btn"></button>
      <button class="btn ghost sm" data-task="unarchive" data-i18n="task.unarchive.btn"></button>
      <button class="btn ghost sm" data-task="transfer" data-i18n="task.transfer.btn"></button>
      <button class="btn ghost sm" data-task="private" data-i18n="task.private.btn"></button>
      <button class="btn ghost sm" data-task="public" data-i18n="task.public.btn"></button>
      <button class="btn danger sm" data-task="delete" data-i18n="task.delete.btn"></button>
    </span>
    <span class="acts" id="actsP">
      <button class="btn ghost sm" data-task="prune" data-i18n="task.prune.btn"></button>
      <button class="btn danger sm" data-task="pkgDelete" data-i18n="task.pkgDelete.btn"></button>
    </span>
  </div>
</div>

<div class="mask" id="mask" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <h2 id="mTitle"></h2>
    <div class="body" id="mBody"></div>
    <div class="foot" id="mFoot"></div>
  </div>
</div>

<script>
"use strict";
/* <core> — pure logic, no DOM access. Extracted verbatim by test/core.test.mjs. */

const I18N = {
en: {
  'app.title':'GitHub Repo Cleaner',
  'app.lede':'Paste a GitHub token to list every repository and package you own. Select in bulk, then transfer to an org, flip visibility, archive, prune old package versions, or delete for good. Every action lists exactly what it will touch before it runs.',
  'trust.1t':'Nothing leaves your browser',
  'trust.1d':'A Content-Security-Policy in the page allows exactly one network destination: api.github.com. No analytics, no backend, no CDN.',
  'trust.2t':'The token is never stored',
  'trust.2d':'It lives in a JavaScript variable for the life of the tab. No localStorage, no cookies, no URL. Reload and it is gone.',
  'trust.3t':'One file you can read',

      message = (data && (data.message || (data.errors && data.errors[0] && data.errors[0].message))) || ('HTTP ' + status);
    }
    const plan = retryPlan({ status, message, headers, attempt, nowMs: Date.now() });
    if (!plan.retry) {
      const e = new Error(message);
      e.status = status; e.data = data; e.plan = plan;
      e.accepted = headers['x-accepted-oauth-scopes'] || '';
      e.perms = headers['x-accepted-github-permissions'] || '';
      e.resetAt = plan.resetAt;
      throw e;
    }
    if (S.onWait) S.onWait(plan, attempt);
    await sleep(plan.waitMs);
  }
}
const gh = async (path, opts) => (await ghRaw(path, opts)).data;

async function ghAll(path) {
  const out = [];
  let url = path + (path.includes('?') ? '&' : '?') + 'per_page=100';
  for (let page = 0; page < PAGE_CAP && url; page++) {
    const r = await ghRaw(url);
    if (!Array.isArray(r.data)) break;
    out.push(...r.data);
    url = r.next;
  }
  if (url) S.capped = Math.max(S.capped, out.length);
  return out;
}

/* ---------- loading ---------- */
async function loadRepos() {
  S.user = await gh('/user');
  S.repos = await ghAll('/user/repos?affiliation=owner,organization_member&sort=pushed');
  S.blocked.clear(); S.failed.clear(); S.notice = ''; S.noticeKind = '';
  try { S.orgs = (await ghAll('/user/orgs')).map(o => o.login); } catch (e) { S.orgs = []; }
}
async function loadPkgs() {
  const found = [];
  const scopes = [{ label: null }, ...S.orgs.map(o => ({ label: o }))];
  let denied = 0, tried = 0;
  for (const sc of scopes) {
    for (const type of PKG_TYPES) {
      tried++;
      const base = sc.label ? '/orgs/' + sc.label + '/packages' : '/user/packages';
      try { found.push(...await ghAll(base + '?package_type=' + type)); }
      catch (e) { if (e.aborted) throw e; if (e.status === 401 || e.status === 403) denied++; }
      await sleep(60);
    }
  }
  S.pkgs = found;
  S.pkgLoaded = true;
  S.pkgWarn = denied === tried ? T('notice.pkgWarn') : '';
}

/* ---------- filters read from the DOM ---------- */
function currentFilter() {
  return {
    q: $('#q').value,
    owner: $('#fOwner').value,
    vis: $('#fVis').value,
    kind: $('#fKind').value,
    age: isRepos() ? $('#fAge').value : 'all',
    isStuck: name => S.blocked.has(name) || S.failed.has(name)
  };
}
function filtered() {
  return selectItems(S.view, S.repos, S.pkgs, currentFilter(), S.sort[S.view], Date.now());
}

/* ---------- rendering ---------- */
function render() {
  S.list = filtered();
  const size = S.pageSize || S.list.length || 1;
  const pages = Math.max(1, Math.ceil(S.list.length / size));
  if (S.page > pages) S.page = pages;
  if (S.page < 1) S.page = 1;
  const start = (S.page - 1) * size;
  const slice = S.list.slice(start, start + size);

  renderNotice();
  renderStats();
  $('#scan').hidden = !isRepos();
  $('#ticket').hidden = !isRepos();
  $('#backup').hidden = !isRepos();
  $('#fAge').hidden = !isRepos();

  const total = isRepos() ? S.repos.length : S.pkgs.length;
  if (!total) {
    $('#table').innerHTML = '<div class="empty">' + esc(isRepos() ? T('empty.repos') : (S.pkgLoaded ? T('empty.pkgs') : T('empty.pkgsLoading'))) + '</div>';
  } else if (!S.list.length) {
    $('#table').innerHTML = '<div class="empty">' + esc(T('empty.filter')) + '</div>';
  } else {
    $('#table').innerHTML = '<div class="tbl-wrap">' + (isRepos() ? repoTable(slice, start) : pkgTable(slice, start)) + '</div>';
    bindTable();
  }
  renderPager(pages);
  syncBars();
}

function renderNotice() {
  const text = isRepos() ? S.notice : S.pkgWarn;
  const el = $('#notice');
  const demoNote = S.demo ? T('notice.demo') : '';
  const capNote = S.capped ? T('notice.pageCap', { n: S.capped }) : '';
  const parts = [demoNote, text, capNote].filter(Boolean);
  el.hidden = !parts.length;
  el.textContent = parts.join('  ');
  el.className = 'notice' + (S.demo ? ' warn' : (S.noticeKind === 'bad' ? ' bad' : (text && isRepos() && S.blocked.size ? ' bad' : (text && !isRepos() ? ' warn' : ''))));
}

const STAT_FILTERS = {

  stale: { fAge: '1' }, empty: { fKind: 'empty' }
};
function renderStats() {

  if (!isRepos()) {

    box.innerHTML = S.pkgs.length
      ? statCell(null, S.pkgs.length, TN('stats.pkgs', S.pkgs.length)) + statCell(null, versions, TN('stats.versions', versions))
      : '';

  }

  box.innerHTML =

    statCell(null, fmtSize(s.sizeKb, S.lang), T('stats.size')) +
    statCell('private', s.priv, T('stats.private')) +
    statCell('forks', s.forks, TN('stats.forks', s.forks)) +

function head(key, label, cls) {

}
function shell(heads, rows) {

function rowHtml(o) {

    '<td class="c"><input type="checkbox"' + (S.sel.has(o.key) ? ' checked' : '') + (o.can ? '' : ' disabled') + ' title="' + esc(o.tip || '') + '" aria-label="' + esc(o.key) + '"></td>' +

const tag = (text, cls) => '<span class="tag' + (cls ? ' ' + cls : '') + '">' + esc(text) + '</span>';

function repoTable(slice, start) {
  const now = Date.now();
  const rows = slice.map((r, i) => {
    const tags = [
      r.private ? tag(T('tag.private'), 'priv') : tag(T('tag.public')),
      r.fork ? tag(T('tag.fork')) : '',
      r.archived ? tag(T('tag.archived'), 'arc') : '',
      r.is_template ? tag(T('tag.template')) : '',
      r.stargazers_count > 0 ? tag('★ ' + r.stargazers_count, 'keep') : '',
      isAdmin(r) ? '' : tag(T('tag.notadmin')),
      S.blocked.has(r.full_name) ? tag(T('tag.blocked', { reason: S.blocked.get(r.full_name).reason }), 'block') : '',
      S.failed.has(r.full_name) ? tag(T('tag.failed', { status: S.failed.get(r.full_name).status }), 'block') : ''
    ].join('');
    const cells =
      '<td class="date hide-s">' + esc(r.language || '—') + '</td>' +
      '<td class="num">' + esc(fmtSize(r.size, S.lang)) + '</td>' +
      '<td class="num hide-s">' + (r.stargazers_count || 0) + '</td>' +
      '<td class="date hide-s">' + esc(fmtDate(r.pushed_at, S.lang, now)) + '</td>';
    return rowHtml({
      i: start + i, key: r.full_name, can: usable(r), tip: isAdmin(r) ? '' : T('tag.notadmin'),
      name: '<span class="ow">' + esc(r.owner.login) + '/</span><a href="' + esc(r.html_url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.name) + '</a>',
      desc: r.description, tags, cells
    });
  }).join('');
  return shell(
    head('full_name', T('col.repo')) + head('language', T('col.lang'), 'hide-s') +
    head('size', T('col.size')) + head('stargazers_count', T('col.stars'), 'hide-s') +
    head('pushed_at', T('col.pushed'), 'hide-s'), rows);
}

function pkgTable(slice, start) {
  const now = Date.now();
  const rows = slice.map((p, i) => {
    const repo = p.repository ? p.repository.full_name : '';
    const vis = p.visibility === 'public' ? tag(T('tag.public'))
      : tag(T(p.visibility === 'internal' ? 'tag.internal' : 'tag.private'), 'priv');
    const tags = tag(p.package_type) + vis + (repo ? tag(T('tag.from', { repo })) : '');
    const cells =
      '<td class="date hide-s">' + esc(p.package_type) + '</td>' +
      '<td class="num">' + esc(p.version_count == null ? '—' : p.version_count) + '</td>' +
      '<td class="date hide-s">' + esc(fmtDate(p.updated_at, S.lang, now)) + '</td>';
    return rowHtml({
      i: start + i, key: pkgKey(p), can: usable(p), tip: '',
      name: '<span class="ow">' + esc(p.owner.login) + '/</span><a href="' + esc(p.html_url || '#') + '" target="_blank" rel="noopener noreferrer">' + esc(p.name) + '</a>',
      desc: '', tags, cells
    });
  }).join('');
  return shell(

function bindTable() {
  const tbl = $('#table').querySelector('table');
  if (!tbl) return;
  tbl.querySelectorAll('thead th.s').forEach(el => el.onclick = () => {
    const k = el.dataset.k, cur = S.sort[S.view];
    const asc = TEXT_KEYS.has(k);
    S.sort[S.view] = { key: k, dir: cur.key === k ? -cur.dir : (asc ? 1 : -1) };
    S.lastIdx = null;
    render();
  });
  const page = pageItems();
  const hAll = $('#hAll');
  const pickable = page.filter(usable);
  hAll.checked = pickable.length > 0 && pickable.every(x => S.sel.has(kOf(x)));
  hAll.onchange = () => {
    pickable.forEach(x => hAll.checked ? S.sel.add(kOf(x)) : S.sel.delete(kOf(x)));
    syncSelection();
  };
  tbl.querySelectorAll('tbody tr').forEach(tr => {
    const box = tr.querySelector('input');
    tr.onclick = e => {
      if (e.target.tagName === 'A' || box.disabled) return;
      const i = +tr.dataset.i, key = tr.dataset.n;
      const on = e.target === box ? box.checked : !S.sel.has(key);
      if (e.shiftKey && S.lastIdx !== null) {
        const a = Math.min(S.lastIdx, i), b = Math.max(S.lastIdx, i);
        S.list.slice(a, b + 1).forEach(x => { if (usable(x)) on ? S.sel.add(kOf(x)) : S.sel.delete(kOf(x)); });
      } else {
        on ? S.sel.add(key) : S.sel.delete(key);
      }
      S.lastIdx = i;
      syncSelection();
    };
  });
}
function pageItems() {
  const size = S.pageSize || S.list.length || 1;
  const start = (S.page - 1) * size;
  return S.list.slice(start, start + size);
}
/* Selection changes touch only the visible rows — a full re-render of 2000 rows per click is not acceptable. */
function syncSelection() {
  const tbl = $('#table').querySelector('table');
  if (tbl) {
    tbl.querySelectorAll('tbody tr').forEach(tr => {
      const on = S.sel.has(tr.dataset.n);
      tr.classList.toggle('sel', on);
      const box = tr.querySelector('input');
      if (box.checked !== on) box.checked = on;
    });
    const pickable = pageItems().filter(usable);
    $('#hAll').checked = pickable.length > 0 && pickable.every(x => S.sel.has(kOf(x)));
  }
  syncBars();
}

function renderPager(pages) {
  const el = $('#pager');
  const sizes = [50, 100, 250, 0];
  const opts = sizes.map(n =>
    '<option value="' + n + '"' + (S.pageSize === n ? ' selected' : '') + '>' +
    esc(n ? T('pager.size', { n }) : T('pager.all')) + '</option>').join('');
  const nav = pages > 1
    ? '<button class="btn ghost sm" id="pPrev"' + (S.page <= 1 ? ' disabled' : '') + '>' + esc(T('pager.prev')) + '</button>' +
      '<span>' + esc(T('pager.page', { page: S.page, pages })) + '</span>' +
      '<button class="btn ghost sm" id="pNext"' + (S.page >= pages ? ' disabled' : '') + '>' + esc(T('pager.next')) + '</button>'
    : '';
  el.innerHTML = S.list.length ? nav + '<select id="pSize" aria-label="page size">' + opts + '</select>' : '';
  if (!S.list.length) return;
  if ($('#pPrev')) $('#pPrev').onclick = () => { S.page--; S.lastIdx = null; render(); window.scrollTo({ top: 0 }); };
  if ($('#pNext')) $('#pNext').onclick = () => { S.page++; S.lastIdx = null; render(); window.scrollTo({ top: 0 }); };
  $('#pSize').onchange = e => { S.pageSize = +e.target.value; S.page = 1; prefSet('pageSize', S.pageSize); render(); };
}

function syncBars() {
  const pool = isRepos() ? S.repos : S.pkgs;
  const picked = pool.filter(x => S.sel.has(kOf(x)));
  const total = pool.length;
  $('#count').textContent = T('count.showing', { shown: S.list.length, total, sel: picked.length });
  $('#aCount').textContent = TN(isRepos() ? 'sel.repos' : 'sel.pkgs', picked.length);
  $('#aSize').textContent = isRepos()
    ? T('sel.sizeRepos', { size: fmtSize(picked.reduce((a, r) => a + (r.size || 0), 0), S.lang), pub: picked.filter(r => !r.private).length, priv: picked.filter(r => r.private).length })
    : TN('sel.sizePkgs', picked.reduce((a, p) => a + (p.version_count || 0), 0));
  $('#action').classList.toggle('on', picked.length > 0 && !S.busy);
  $('#actsR').classList.toggle('on', isRepos());
  $('#actsP').classList.toggle('on', !isRepos());
  const bits = [TN('bar.repos', S.repos.length)];
  if (S.pkgLoaded) bits.push(TN('bar.pkgs', S.pkgs.length));
  if (S.orgs.length) bits.push(TN('bar.orgs', S.orgs.length));
  if (S.rate !== '' && !S.demo) bits.push(T('bar.rate', { n: S.rate }));
  if (lacksDeleteScope(S.tokenKind, S.scopes)) bits.push(T('bar.noDelete'));
  $('#stat').textContent = bits.join(' · ');
}

/* ---------- tasks ---------- */
const repoPath = r => '/repos/' + r.owner.login + '/' + r.name;
const pkgPath = p => (p.owner.login === S.user.login ? '/user' : '/orgs/' + p.owner.login) +
  '/packages/' + p.package_type + '/' + encodeURIComponent(p.name);

const TASKS = {
  delete: {
    danger: true, note: 'task.delete.note',
    run: r => gh(repoPath(r), { method: 'DELETE' }),
    after: r => { S.gone.add(r.full_name); S.sel.delete(r.full_name); },
    ok: () => T('task.delete.ok')
  },
  transfer: {
    note: 'task.transfer.note',
    field: { id: 'cTarget', kind: 'org', label: 'task.transfer.field' },
    skip: r => r.archived ? 'task.skipArchived' : null,
    run: (r, o) => gh(repoPath(r) + '/transfer', { method: 'POST', body: JSON.stringify({ new_owner: o.target }) }),
    after: r => { S.gone.add(r.full_name); S.sel.delete(r.full_name); },
    ok: (r, res, o) => T('task.transfer.ok', { target: o.target })
  },
  private: {
    note: 'task.private.note',
    skip: r => r.archived ? 'task.skipArchived' : (r.private ? 'task.private.skip' : null),
    run: r => gh(repoPath(r), { method: 'PATCH', body: JSON.stringify({ visibility: 'private' }) }),
    after: r => { r.private = true; r.visibility = 'private'; },
    ok: () => T('task.private.ok')
  },
  public: {
    note: 'task.public.note', ack: 'task.public.ack',
    skip: r => r.archived ? 'task.skipArchived' : (r.private ? null : 'task.public.skip'),
    run: r => gh(repoPath(r), { method: 'PATCH', body: JSON.stringify({ visibility: 'public' }) }),
    after: r => { r.private = false; r.visibility = 'public'; },
    ok: () => T('task.public.ok')
  },
  archive: {
    note: 'task.archive.note',
    skip: r => r.archived ? 'task.archive.skip' : null,
    run: r => gh(repoPath(r), { method: 'PATCH', body: JSON.stringify({ archived: true }) }),
    after: r => { r.archived = true; },
    ok: () => T('task.archive.ok')
  },
  unarchive: {
    note: 'task.unarchive.note',
    skip: r => r.archived ? null : 'task.unarchive.skip',
    run: r => gh(repoPath(r), { method: 'PATCH', body: JSON.stringify({ archived: false }) }),
    after: r => { r.archived = false; },
    ok: () => T('task.unarchive.ok')
  },
  pkgDelete: {
    pkg: true, danger: true, note: 'task.pkgDelete.note',
    run: p => gh(pkgPath(p), { method: 'DELETE' }),
    after: p => { S.gone.add(pkgKey(p)); S.sel.delete(pkgKey(p)); },
    ok: () => T('task.pkgDelete.ok')
  },
  prune: {
    pkg: true, note: 'task.prune.note', ack: 'task.prune.ack',
    field: { id: 'cKeep', kind: 'number', value: 5, label: 'task.prune.field' },
    skip: p => (p.version_count || 0) > 1 ? null : 'task.prune.skip',
    run: async (p, o) => {
      const keep = Math.max(1, parseInt(o.keep, 10) || 1);
      const versions = await ghAll(pkgPath(p) + '/versions?state=active');
      versions.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
      const doomed = versions.slice(keep);
      for (const v of doomed) {
        await gh(pkgPath(p) + '/versions/' + v.id, { method: 'DELETE' });
        await sleep(120);
      }
      return doomed.length;
    },
    demoRun: (p, o) => Math.max(0, (p.version_count || 0) - Math.max(1, parseInt(o.keep, 10) || 1)),
    after: (p, o, n) => { p.version_count = Math.max(0, (p.version_count || 0) - n); },
    ok: (p, n) => n ? T('task.prune.ok', { n }) : T('task.prune.ok0')
  }
};
const taskTitle = (kind, n) => TN('task.' + kind + '.title', n);

/* ---------- modal plumbing ---------- */
function show(title, body, foot) {
  if (!$('#mask').classList.contains('on')) S.lastFocus = document.activeElement;
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = body;
  $('#mFoot').innerHTML = foot;
  $('#mask').classList.add('on');
}
function closeModal() {
  if (S.busy) return;
  $('#mask').classList.remove('on');
  if (S.lastFocus && S.lastFocus.focus) S.lastFocus.focus();
  S.lastFocus = null;
}
function focusables() {
  return [...$('#mask').querySelectorAll('button,input,select,textarea,a[href]')].filter(el => !el.disabled && el.offsetParent !== null);
}
function onCancel(fn) { const el = $('#cCancel'); if (el) el.onclick = fn || closeModal; }
const footClose = () => '<span class="spacer"></span><button class="btn ghost sm" id="cCancel">' + esc(T('act.gotIt')) + '</button>';

/* ---------- task dialog ---------- */
function openTask(kind) {
  const K = TASKS[kind];
  const pool = K.pkg ? S.pkgs : S.repos;
  const chosen = pool.filter(x => S.sel.has(kOf(x)) && usable(x));
  const items = [], skipped = new Map();
  for (const x of chosen) {
    const why = K.skip ? K.skip(x) : null;
    if (why) skipped.set(why, (skipped.get(why) || 0) + 1);
    else items.push(x);
  }
  if (!items.length) {
    const why = [...skipped.keys()].map(k => T(k)).join(' / ') || T('task.none.reason');
    show(T('task.none.title'), '<p>' + esc(T('task.none.body', { reason: why })) + '</p>', footClose());
    onCancel(); focusFirst(); return;
  }
  const rows = items.map(x => {
    const flags = [];
    if (K.pkg) {
      flags.push((x.version_count || 0) + ' ' + TN('stats.versions', x.version_count || 0));
      if (x.visibility === 'public') flags.push(T('tag.public'));
    } else {
      if (kind === 'delete' || kind === 'transfer') {
        if (x.stargazers_count) flags.push('★ ' + x.stargazers_count);
        if (x.forks_count) flags.push(x.forks_count + ' ' + TN('stats.forks', x.forks_count));
      }
      if (x.archived) flags.push(T('tag.archived'));
      if (x.private) flags.push(T('tag.private'));
    }
    const label = K.pkg ? x.owner.login + '/' + x.name : x.full_name;
    return '<div><span>' + esc(label) + '</span><span class="flag">' + esc(flags.join(' · ')) + '</span></div>';
  }).join('');

  const f = K.field;
  const fieldHtml = !f ? '' : f.kind === 'number'
    ? '<div class="field"><label for="' + f.id + '">' + esc(T(f.label)) + '</label><input id="' + f.id + '" type="number" min="0" step="1" value="' + f.value + '"></div>'
    : '<div class="field"><label for="' + f.id + '">' + esc(T(f.label)) + '</label>' +
      '<input id="' + f.id + '" list="orgList" placeholder="' + esc(S.orgs[0] || 'my-org') + '" autocomplete="off" spellcheck="false">' +
      '<datalist id="orgList">' + S.orgs.map(o => '<option value="' + esc(o) + '">').join('') + '</datalist></div>';
  const ackText = K.danger ? T('ack.delete') : (K.ack ? T(K.ack) : '');
  const skipLine = skipped.size
    ? '<p class="warn">' + esc(TN('task.skipped', [...skipped.values()].reduce((a, b) => a + b, 0), { why: [...skipped.keys()].map(k => T(k)).join(' / ') })) + '</p>' : '';
  const preflight = (kind === 'delete' && lacksDeleteScope(S.tokenKind, S.scopes) && !S.demo)
    ? '<p class="bad">' + T('task.preflightDelete') + '</p>' : '';

  show(taskTitle(kind, items.length),

    let ok = true;

/* ---------- runner ---------- */
function describeError(e) {
  if (e.aborted) return { msg: T('err.aborted'), extra: '' };
  if (e.status === 404) return { msg: T('err.404'), extra: '' };
  if (e.status === 451) {
    const b = (e.data && e.data.block) || {};
    return {
      msg: T('err.451', { reason: b.reason ? ' (' + b.reason + ')' : '' }),
      extra: b.html_url ? ' <a href="' + esc(b.html_url) + '" target="_blank" rel="noopener noreferrer">notice</a>' : ''
    };
  }
  if (e.plan && e.plan.reason === 'primary') return { msg: T('err.rateLimit', { time: fmtClock(e.resetAt || Date.now()) }), extra: '' };
  if (e.plan && e.plan.reason === 'secondary') return { msg: T('err.secondary'), extra: '' };
  if (e.status === 0) return { msg: T('err.net'), extra: '' };
  if (e.status === 403) {
    const need = e.perms || e.accepted;
    const have = S.scopes || (S.tokenKind === 'fine' ? T('perm.kindFine') : T('err.unknownScopes'));
    return {
      msg: T('err.403', { msg: e.message }),
      extra: (need ? '<br>　' + esc(T('err.needs', { need, have })) : '') +
        '<br>　' + esc(S.tokenKind === 'fine' ? T('advice.fine') : T('advice.classic', { scopes: S.scopes || T('err.unknownScopes') }))
    };
  }
  return { msg: e.message, extra: '' };
}
function updateRowStatus(key) {
  const tr = $('#table').querySelector('tr[data-n="' + (window.CSS && CSS.escape ? CSS.escape(key) : key.replace(/"/g, '\\"')) + '"]');
  if (!tr) return;
  const st = S.status.get(key);
  const cell = tr.lastElementChild;
  cell.innerHTML = st ? '<span class="st ' + st.state + '">' + esc(st.text) + '</span>' : '';
  tr.classList.toggle('gone', S.gone.has(key));
}

async function runTask(items, kind, opts) {
  const K = TASKS[kind];
  S.busy = true;
  S.abort = new AbortController();
  S.report = [];
  $('#action').classList.remove('on');
  show(T('run.title', { title: taskTitle(kind, items.length) }),
    '<div class="prog' + (K.danger ? ' red' : '') + '"><i id="pBar"></i></div><div class="log" id="pLog" aria-live="polite"></div>',
    '<span class="count" id="pTip">' + esc(T('run.tip')) + '</span><span class="spacer"></span>' +
    '<button class="btn ghost sm" id="pStop">' + esc(T('act.stop')) + '</button>' +
    '<button class="btn ghost sm" id="pClose" disabled>' + esc(T('act.done')) + '</button>');
  const log = $('#pLog'), tip = $('#pTip');
  $('#pStop').onclick = () => { $('#pStop').disabled = true; $('#pStop').textContent = T('act.stopping'); S.abort.abort(); };
  S.onWait = plan => {
    tip.textContent = plan.reason === 'primary' || plan.reason === 'secondary'
      ? T('run.waiting', { s: Math.ceil(plan.waitMs / 1000) })
      : T('run.retry', { n: 1 });
  };
  const line = (cls, text, html) => {
    log.insertAdjacentHTML('beforeend', '<div class="' + cls + '">' + esc(text) + (html || '') + '</div>');
    log.scrollTop = log.scrollHeight;
  };
  const note = (action, target, result, detail) =>
    S.report.push([new Date().toISOString(), action, target, result, detail]);

  let ok = 0, fail = 0, stopped = false;
  for (let i = 0; i < items.length; i++) {
    if (S.abort.signal.aborted) { stopped = true; break; }
    const x = items[i];
    const key = kOf(x);
    const label = K.pkg ? x.owner.login + '/' + x.name : x.full_name;
    S.status.set(key, { state: 'run', text: T('run.processing') });
    updateRowStatus(key);
    try {
      const res = S.demo ? await demoRun(K, x, opts) : await K.run(x, opts);
      K.after(x, opts, res);
      const text = K.ok(x, res, opts);
      S.status.set(key, { state: 'ok', text });
      ok++;
      note(kind, label, 'ok', text);
      line('ok', text + '  ' + label);
    } catch (e) {
      if (e.aborted) { S.status.delete(key); stopped = true; break; }
      const d = describeError(e);
      S.status.set(key, { state: 'err', text: d.msg });
      if (kind === 'delete' && e.status !== 451) S.failed.set(x.full_name, { status: e.status || 0, msg: e.message });
      if (e.status === 451) S.blocked.set(x.full_name, { reason: ((e.data && e.data.block) || {}).reason || 'unknown', url: ((e.data && e.data.block) || {}).html_url || '' });
      fail++;
      note(kind, label, 'failed', d.msg);
      line('no', (S.lang === 'zh' ? '失败  ' : 'failed  ') + label + ' — ' + d.msg, d.extra);
    }
    updateRowStatus(key);
    tip.textContent = T('run.tip');
    $('#pBar').style.width = ((i + 1) / items.length * 100) + '%';
    if (i < items.length - 1) { try { await sleep(S.demo ? 40 : 220); } catch (e) { stopped = true; break; } }
  }
  S.busy = false; S.onWait = null;
  const skip = items.length - ok - fail;
  $('#mTitle').textContent = stopped ? T('run.stopped') : (fail ? T('run.doneFail') : T('run.done'));
  $('#pTip').textContent = T('run.summary', {
    ok,
    failPart: fail ? T('run.failPart', { n: fail }) : '',
    skipPart: stopped && skip > 0 ? T('run.skipPart', { n: skip }) : ''
  }) + (kind === 'transfer' && ok ? T('run.transferNote') : '');
  $('#pStop').remove();
  if (S.report.length) {
    $('#pTip').insertAdjacentHTML('afterend',
      '<button class="btn ghost sm" id="pReport">' + esc(T('run.report')) + '</button>');
    $('#pReport').onclick = () => download('repo-cleaner-' + kind + '-' + stamp() + '.csv',
      '﻿' + toCSV(RUN_CSV_HEAD, S.report), 'text/csv;charset=utf-8');
  }
  const done = $('#pClose');
  done.disabled = false; done.onclick = closeModal; done.focus();
  render();
}
async function demoRun(K, x, opts) {
  await sleep(90 + Math.random() * 160);
  if (Math.random() < 0.08) { const e = new Error(T('demo.simFail')); e.status = 403; throw e; }
  return K.demoRun ? K.demoRun(x, opts) : null;
}

/* ---------- files & clipboard ---------- */
function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}
function download(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  if (btn) { const old = btn.textContent; btn.textContent = T('act.copied'); setTimeout(() => { btn.textContent = old; }, 1600); }
}
function pickedOrFiltered() {

/* ---------- blocked scan + support ticket ---------- */
async function scanBlocked() {
  if (S.scanning) { if (S.abort) S.abort.abort(); return; }
  if (!S.repos.length || S.busy) return;
  S.scanning = true;
  S.abort = new AbortController();
  S.blocked.clear();
  const btn = $('#scan');
  btn.textContent = T('act.stop');
  const note = $('#notice');
  note.hidden = false; note.className = 'notice';
  const list = S.repos.slice();
  let next = 0, done = 0;
  const worker = async () => {
    while (next < list.length && !S.abort.signal.aborted) {
      const r = list[next++];
      try { await gh(repoPath(r)); }
      catch (e) {
        if (e.aborted) return;
        if (e.status === 451) {
          const b = (e.data && e.data.block) || {};
          S.blocked.set(r.full_name, { reason: b.reason || 'unknown', url: b.html_url || '' });
        }
      }
      done++;
      note.textContent = T('notice.scanning', { done, total: list.length, found: S.blocked.size });
    }
  };
  try { await Promise.all(Array.from({ length: 5 }, worker)); } catch (e) {}
  S.scanning = false;
  btn.textContent = T('act.scan');
  S.notice = S.blocked.size ? T('notice.blockedFound', { n: S.blocked.size }) : T('notice.blockedNone');
  S.noticeKind = S.blocked.size ? 'bad' : '';
  render();
}
function ticketReason(r) {
  const b = S.blocked.get(r.full_name);
  if (b) return 'disabled by GitHub, reason: ' + b.reason + (b.url ? ', notice: ' + b.url : '');
  const f = S.failed.get(r.full_name);
  if (f) return 'deletion returns HTTP ' + f.status + ': ' + f.msg;
  if (!isAdmin(r)) return 'I have no admin rights on this repository';
  return 'I am unable to delete it from my account';
}
function openTicket() {
  const stuck = r => S.blocked.has(r.full_name) || S.failed.has(r.full_name);
  const picked = S.repos.filter(r => S.sel.has(r.full_name));
  const items = picked.length ? picked : S.repos.filter(stuck);
  if (!items.length) {
    show(T('ticket.none.title'), '<p>' + esc(T('ticket.none.body')) + '</p>', footClose());
    onCancel(); focusFirst(); return;
  }
  const nBlocked = items.filter(r => S.blocked.has(r.full_name)).length;
  const n403 = items.filter(r => { const f = S.failed.get(r.full_name); return f && f.status === 403; }).length;
  const body = ticketBody(S.user.login, items, ticketReason);
  const warn = (n403 && lacksDeleteScope(S.tokenKind, S.scopes))
    ? '<p class="bad">' + esc(T('ticket.warn403', { n: n403 })) + '</p>' : '';
  show(TN('ticket.title', items.length),
    '<p>' + esc(T('ticket.intro', { blocked: nBlocked, failed: items.length - nBlocked })) + ' ' +
    esc(picked.length ? T('ticket.fromSel') : T('ticket.fromAll')) + '</p>' + warn +
    '<textarea class="ta" id="tTxt" readonly>' + esc(body) + '</textarea>',
    '<button class="btn sm" id="tCopy">' + esc(T('act.copy')) + '</button>' +
    '<button class="btn ghost sm" id="tOpen">' + esc(T('act.openSupport')) + '</button>' +
    '<span class="spacer"></span><button class="btn ghost sm" id="cCancel">' + esc(T('act.close')) + '</button>');
  $('#tCopy').onclick = e => copyText(body, e.target);
  $('#tOpen').onclick = async () => {
    await copyText(body, $('#tCopy'));
    window.open('https://support.github.com/request', '_blank', 'noopener,noreferrer');
  };
  onCancel();
  $('#tTxt').focus();
}

  S.notice = ''; S.noticeKind = ''; S.capped = 0; S.scopes = null; S.rate = ''; S.view = 'repos'; S.page = 1;
  $('#hero').querySelector('.hero-top').appendChild($('#utils'));
  $('#hero').style.display = '';
  $('#bar').classList.remove('on');
  $('#tools').classList.remove('on');
  $('#action').classList.remove('on');
  $('#stats').innerHTML = ''; $('#table').innerHTML = ''; $('#pager').innerHTML = '';
  $('#notice').hidden = true;
  $('#tabR').classList.add('on'); $('#tabP').classList.remove('on');
  $('#token').focus();
}

/* ---------- events ---------- */
$('#go').onclick = connect;
$('#demo').onclick = startDemo;
$('#token').onkeydown = e => { if (e.key === 'Enter') connect(); };
$('#tabR').onclick = () => switchView('repos');
$('#tabP').onclick = () => switchView('packages');
$('#perms').onclick = openPerms;
$('#scan').onclick = scanBlocked;
$('#ticket').onclick = openTicket;
$('#backup').onclick = openBackup;
$('#export').onclick = openExport;
$('#keysBtn').onclick = openKeys;
$('#logout').onclick = reset;
$('#refresh').onclick = async () => {
  if (S.busy || S.demo) { if (S.demo) startDemo(); return; }
  S.sel.clear(); S.status.clear(); S.gone.clear(); S.failed.clear(); S.capped = 0;
  S.abort = new AbortController();
  const btn = $('#refresh');
  btn.disabled = true;
  try {
    await loadRepos();
    if (S.pkgLoaded) { S.pkgLoaded = false; await loadPkgs(); }
    fillFilters(true); render();
  } catch (e) {
    if (!e.aborted) { S.notice = T('err.load', { msg: describeError(e).msg }); S.noticeKind = 'bad'; render(); }
  } finally { btn.disabled = false; }
};
['#q', '#fOwner', '#fVis', '#fKind', '#fAge'].forEach(s =>
  $(s).addEventListener('input', () => { S.lastIdx = null; S.page = 1; render(); }));
$('#selAll').onclick = () => { filtered().forEach(x => { if (usable(x)) S.sel.add(kOf(x)); }); render(); };
$('#selInv').onclick = () => {
  filtered().forEach(x => {
    if (!usable(x)) return;
    const k = kOf(x);
    S.sel.has(k) ? S.sel.delete(k) : S.sel.add(k);
  });
  render();
};
$('#selNone').onclick = () => { S.sel.clear(); syncSelection(); };
$('#aClear').onclick = () => { S.sel.clear(); syncSelection(); };
$('#lang').onclick = () => setLang(S.lang === 'en' ? 'zh' : 'en');
$('#theme').onclick = () => setTheme(THEMES[(THEMES.indexOf(S.theme) + 1) % THEMES.length]);
document.querySelectorAll('[data-task]').forEach(b => b.onclick = () => openTask(b.dataset.task));
$('#mask').onclick = e => { if (e.target === $('#mask')) closeModal(); };
$('#mask').addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const els = focusables();
  if (!els.length) return;
  const first = els[0], last = els[els.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.addEventListener('keydown', e => {
  const open = $('#mask').classList.contains('on');
  if (e.key === 'Escape') {
    if (open) closeModal();
    else if (S.sel.size) { S.sel.clear(); syncSelection(); }
    return;
  }
  if (open || e.ctrlKey || e.metaKey || e.altKey) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (typing || !$('#tools').classList.contains('on')) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'a' || e.key === 'A') { e.preventDefault(); $('#selAll').click(); }
  else if (e.key === 'c' || e.key === 'C') { e.preventDefault(); $('#selNone').click(); }
  else if (e.key === '?') { e.preventDefault(); openKeys(); }
});
window.addEventListener('beforeunload', e => { if (S.busy) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- boot ---------- */
(function boot() {
  const saved = prefGet('lang', '');
  const nav = (navigator.language || 'en').toLowerCase();
  S.lang = saved === 'zh' || saved === 'en' ? saved : (nav.startsWith('zh') ? 'zh' : 'en');
  const size = parseInt(prefGet('pageSize', '100'), 10);
  S.pageSize = [0, 50, 100, 250].includes(size) ? size : 100;
  setTheme(THEMES.includes(prefGet('theme', 'auto')) ? prefGet('theme', 'auto') : 'auto');
  applyI18n();
  $('#token').focus();
})();
</script>
</body>
</html>
